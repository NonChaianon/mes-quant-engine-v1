name: MES Quant CI V1

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mes-quant-ci-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quant-ci-v1:
    name: Quant CI V1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"

      - name: Compile and import active Python code
        run: |
          python -m compileall -q src tests tools
          python - <<'PY'
          import mes_quant
          from mes_quant.exploration import HARNESS_EXECUTION_STATUS
          from mes_quant.exploration.l1_lr001 import FIRST_L1_EXPERIMENT_ID, FOLD_SPECS
          from mes_quant.redundancy import analyzer, contract

          assert analyzer.run_stage_b is not None
          assert HARNESS_EXECUTION_STATUS == "DRY_RUN_ONLY_L0"
          assert FIRST_L1_EXPERIMENT_ID == "MES_S1_LR001_20260815T095100Z"
          assert [year for _, _, year in FOLD_SPECS] == [2022, 2023]
          print("Active imports passed.")
          print(f"Stage B Python policy status: {contract.POLICY_STATUS}")
          print(f"Stage B execution status: {contract.EXECUTION_STATUS}")
          print(f"Sprint 1 harness status: {HARNESS_EXECUTION_STATUS}")
          print(f"First L1 experiment ID: {FIRST_L1_EXPERIMENT_ID}")
          PY

      - name: Run critical Ruff checks
        run: >-
          python -m ruff check
          --select E9,F401,F63,F7,F82
          src tests tools

      - name: Run direct constitutional gate tests
        run: >-
          python -m pytest -p no:cacheprovider
          tests/test_redundancy.py::StageBConstitutionalPolicyGateDirectTests

      - name: Run project-root gate tests
        run: >-
          python -m pytest -p no:cacheprovider
          tests/test_redundancy.py::StageBProjectRootGateSpecificationTests

      - name: Run Phase 0 and Phase A focused tests
        shell: bash
        run: |
          registry_path="artifacts/runs/cell14_20260809T175203Z/cell14_feature_registry_v1.csv"
          focused_tests=(
            tests/test_redundancy.py::StageBPhase0FirewallSpecificationTests
            tests/test_redundancy.py::StageBPhase0FullOrchestrationSpecificationTests
            tests/test_redundancy.py::StageBPhase0ProductionOrchestrationSpecificationTests
            tests/test_redundancy.py::StageBPhaseASemanticIntegrationSpecificationTests
          )

          if [[ -f "$registry_path" ]]; then
            focused_tests+=(tests/test_redundancy.py::StageBPhaseADecisionBridgeRedSpecificationTests)
          else
            echo "::notice title=Environmental fixture exclusion::The external Cell14 feature-registry artifact is not present. StageBPhaseADecisionBridgeRedSpecificationTests is external-fixture-dependent and is intentionally not executed in checkout-only CI. This environmental absence is not a pass; artifact-enabled validation remains separately required where applicable."
          fi

          focused_tests+=(tests/test_redundancy.py::StageBGenericRankAuthorityV12SpecificationTests)
          focused_tests+=(tests/test_redundancy.py::StageBGroupRankAndPhaseCSensitivitySpecificationTests)
          focused_tests+=(tests/test_redundancy.py::StageBProductionBoundarySpecificationTests)
          python -m pytest -p no:cacheprovider "${focused_tests[@]}"

      - name: Run checkout-safe Stage B redundancy suite
        shell: bash
        run: |
          registry_path="artifacts/runs/cell14_20260809T175203Z/cell14_feature_registry_v1.csv"
          registry_test="tests/test_redundancy.py::StageBCanonicalRegistryCompatibilitySpecificationTests::test_frozen_canonical_cell14_registry_is_accepted_without_metadata_rewrite"
          decision_bridge_class="tests/test_redundancy.py::StageBPhaseADecisionBridgeRedSpecificationTests"

          if [[ -f "$registry_path" ]]; then
            python -m pytest -p no:cacheprovider tests/test_redundancy.py
          else
            echo "::notice title=Environmental fixture exclusions::The external Cell14 feature-registry artifact is not present. The frozen canonical-registry compatibility test and StageBPhaseADecisionBridgeRedSpecificationTests are intentionally not executed in checkout-only CI. These environmental exclusions are not passes; artifact-enabled validation remains separately required where applicable."
            python -m pytest -p no:cacheprovider \
              tests/test_redundancy.py \
              --deselect="$registry_test" \
              --deselect="$decision_bridge_class"
          fi

      - name: Run other checkout-safe repository tests
        run: |
          python -m pytest -p no:cacheprovider \
            tests/test_manifest.py \
            tests/test_feature_builder.py \
            tests/test_reference_freeze.py \
            tests/test_exploration_harness.py \
            tests/test_exploration_l1_lr001.py
          echo "::notice title=Environmental data not present::tests/test_cell14_release.py is not run in checkout-only CI because it requires the complete ignored Cell14 release artifacts."
          echo "::notice title=L1 real-data run excluded::LR001 CI uses synthetic fixtures only. No realized TRAIN label artifact is present or opened in checkout-only CI."
